<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="1차 팀 빌딩 및 GitHub 저장소 초기 세팅 기록">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f9ff"/>
      <stop offset="100%" stop-color="#eaf2fc"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" rx="16" fill="url(#bg1)"/>
  <!-- Browser Window -->
  <rect x="36" y="34" width="568" height="332" rx="12" fill="#ffffff" stroke="#dbe7f5" stroke-width="2"/>
  <rect x="36" y="34" width="568" height="38" rx="12" fill="#f8fafd"/>
  <line x1="36" y1="72" x2="604" y2="72" stroke="#e8eef6" stroke-width="1.5"/>
  <circle cx="58" cy="53" r="5.5" fill="#ff6b6b"/>
  <circle cx="76" cy="53" r="5.5" fill="#ffd43b"/>
  <circle cx="94" cy="53" r="5.5" fill="#51cf66"/>
  <text x="120" y="58" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#6b7a90">github.com/matstar33/OpenSourceSW-I-Team</text>

  <!-- Repo Header -->
  <rect x="64" y="94" width="84" height="24" rx="12" fill="#eaf3ff"/>
  <text x="106" y="110" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">2026.10.30</text>
  <text x="160" y="111" font-family="Pretendard, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#222">Team Rainbow · 1차 킥오프 회의록</text>

  <!-- Left Card: Repository Setup -->
  <rect x="64" y="134" width="246" height="202" rx="10" fill="#f9fbfe" stroke="#e3ecf7"/>
  <text x="82" y="162" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#333">초기 저장소 세팅</text>
  <rect x="82" y="176" width="210" height="34" rx="6" fill="#fff" stroke="#e6eef8"/>
  <text x="94" y="198" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">✓ 원격 저장소 생성 (Public)</text>
  <rect x="82" y="218" width="210" height="34" rx="6" fill="#fff" stroke="#e6eef8"/>
  <text x="94" y="240" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">✓ MIT 오픈소스 라이선스 채택</text>
  <rect x="82" y="260" width="210" height="34" rx="6" fill="#fff" stroke="#e6eef8"/>
  <text x="94" y="282" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">✓ 팀원 6명 Collaborator 초대</text>
  <text x="82" y="318" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#7a889b">주제: IT 스튜디오형 팀 포트폴리오</text>

  <!-- Right Card: Commit Rules -->
  <rect x="330" y="134" width="246" height="202" rx="10" fill="#f9fbfe" stroke="#e3ecf7"/>
  <text x="348" y="162" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#333">합의한 커밋 메시지 규칙</text>

  <rect x="348" y="178" width="54" height="24" rx="5" fill="#4a90e2"/>
  <text x="375" y="194" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">feat:</text>
  <text x="412" y="194" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">새로운 화면·기능 추가</text>

  <rect x="348" y="212" width="54" height="24" rx="5" fill="#3b7ddd"/>
  <text x="375" y="228" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">style:</text>
  <text x="412" y="228" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">CSS 레이아웃·디자인 수정</text>

  <rect x="348" y="246" width="54" height="24" rx="5" fill="#5c9ce6"/>
  <text x="375" y="262" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">fix:</text>
  <text x="412" y="262" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">오류 및 화면 깨짐 수정</text>

  <rect x="348" y="280" width="54" height="24" rx="5" fill="#6ea8eb"/>
  <text x="375" y="296" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#fff">docs:</text>
  <text x="412" y="296" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#444">README·문서 정리</text>
</svg>
