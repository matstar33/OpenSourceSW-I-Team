  <text x="346" y="102" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">활동 기록</text>

  <!-- Main Placeholder -->
  <rect x="50" y="134" width="344" height="156" rx="8" fill="#f8fbff" stroke="#dce8f8" stroke-dasharray="5 4"/>
  <text x="222" y="204" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4a90e2">각 담당자 페이지 콘텐츠 영역 (&lt;main&gt;)</text>
  <text x="222" y="228" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#6b7a90">현재 주소와 일치하는 메뉴 자동 active 처리</text>

