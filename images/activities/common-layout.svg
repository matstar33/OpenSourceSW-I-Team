  <!-- Site Header Mock -->
  <rect x="50" y="76" width="344" height="44" rx="6" fill="#fff" stroke="#eaeef4"/>
  <text x="66" y="103" font-family="Pretendard, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#4a90e2">Rainbow</text>
  <text x="190" y="102" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#444">홈</text>
  <text x="216" y="102" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#444">팀 소개</text>
