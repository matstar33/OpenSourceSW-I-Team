  <text x="460" y="216" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#444">프로젝트</text>
  <rect x="450" y="228" width="136" height="26" rx="4" fill="#eef5ff"/>
  <text x="460" y="245" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">활동 기록</text>

