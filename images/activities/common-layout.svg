  <text x="518" y="62" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#7a889b">모바일 (≤768px)</text>
  <rect x="444" y="76" width="148" height="38" rx="6" fill="#fff" stroke="#eaeef4"/>
  <text x="456" y="100" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4a90e2">Rainbow</text>
  <text x="572" y="100" font-family="Pretendard, -apple-system, sans-serif" font-size="14" fill="#333">☰</text>

