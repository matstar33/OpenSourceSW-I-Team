  <text x="460" y="138" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#444">홈</text>
  <text x="460" y="164" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#444">팀 소개</text>
