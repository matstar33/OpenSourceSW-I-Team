<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="파트별 상세 페이지 개발 및 1차 PR 제출">
  <rect width="640" height="400" rx="16" fill="#f4f8fd"/>
  <rect x="34" y="32" width="572" height="336" rx="12" fill="#ffffff" stroke="#dbe7f5" stroke-width="2"/>

  <text x="62" y="70" font-family="Pretendard, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#222">파트별 Feature 브랜치 구현 및 1차 PR 제출</text>
  <text x="62" y="92" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#6b7a90">공통 스타일을 유지하면서 페이지별 마크업·스타일·인터랙션 분리 개발</text>

  <!-- Timeline UI Preview inside Card -->
  <rect x="62" y="114" width="296" height="226" rx="10" fill="#f8fbff" stroke="#d8e6f8"/>
  <text x="82" y="142" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4a90e2">activities.html 구현 내역</text>
  <line x1="94" y1="164" x2="94" y2="312" stroke="#cfe2fa" stroke-width="3"/>
  <circle cx="94" cy="172" r="6" fill="#4a90e2"/>
  <text x="112" y="176" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#333">시간순 활동 기록 타임라인 UI</text>
  <circle cx="94" cy="216" r="6" fill="#4a90e2"/>
  <text x="112" y="220" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#333">회의 · 개발 · 협업 카테고리 필터</text>
  <circle cx="94" cy="260" r="6" fill="#4a90e2"/>
  <text x="112" y="264" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#333">시간순 / 최신순 정렬 토글</text>
  <circle cx="94" cy="304" r="6" fill="#4a90e2"/>
  <text x="112" y="308" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#333">활동 스냅샷 갤러리 및 확대 모달</text>

  <!-- Right Column: Conflict-free structure -->
  <rect x="378" y="114" width="202" height="226" rx="10" fill="#f9fafc" stroke="#e3eaf3"/>
  <text x="396" y="142" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#333">병합 충돌 방지 설계</text>

  <rect x="396" y="160" width="166" height="44" rx="8" fill="#fff" stroke="#e4ecf6"/>
  <text x="410" y="180" font-family="monospace" font-size="11" font-weight="700" fill="#4a90e2">activities.html</text>
  <text x="410" y="196" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">공통 헤더·푸터 원본 유지</text>

  <rect x="396" y="214" width="166" height="44" rx="8" fill="#fff" stroke="#e4ecf6"/>
  <text x="410" y="234" font-family="monospace" font-size="11" font-weight="700" fill="#4a90e2">css/activities.css</text>
  <text x="410" y="250" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">전용 스타일시트 분리</text>

  <rect x="396" y="268" width="166" height="44" rx="8" fill="#fff" stroke="#e4ecf6"/>
  <text x="410" y="288" font-family="monospace" font-size="11" font-weight="700" fill="#4a90e2">js/activities.js</text>
  <text x="410" y="304" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">필터·모달 스크립트 분리</text>
</svg>
