<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="최종 코드 리뷰 병합 및 GitHub Pages 배포 절차">
  <rect width="640" height="400" rx="16" fill="#f4f8fd"/>
  <rect x="34" y="32" width="572" height="336" rx="12" fill="#ffffff" stroke="#dbe7f5" stroke-width="2"/>

  <text x="62" y="70" font-family="Pretendard, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#222">코드 리뷰 · 최종 병합 및 GitHub Pages 배포</text>
  <text x="62" y="92" font-family="Pretendard, -apple-system, sans-serif" font-size="12" fill="#6b7a90">각 브랜치 PR 상호 리뷰 승인 후 main 통합 및 정적 웹 호스팅 오픈</text>

  <!-- 4 Step Pipeline -->
  <rect x="58" y="128" width="118" height="104" rx="10" fill="#f8fbff" stroke="#cfe2fa" stroke-width="1.5"/>
  <text x="117" y="156" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">STEP 1</text>
  <text x="117" y="182" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#222">1차 PR 등록</text>
  <text x="117" y="204" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">화면 캡처 첨부</text>

  <text x="188" y="184" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4a90e2">→</text>

  <rect x="200" y="128" width="118" height="104" rx="10" fill="#f8fbff" stroke="#cfe2fa" stroke-width="1.5"/>
  <text x="259" y="156" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">STEP 2</text>
  <text x="259" y="182" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#222">상호 리뷰</text>
  <text x="259" y="204" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">1명 이상 승인</text>

  <text x="330" y="184" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4a90e2">→</text>

  <rect x="342" y="128" width="118" height="104" rx="10" fill="#f8fbff" stroke="#cfe2fa" stroke-width="1.5"/>
  <text x="401" y="156" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#4a90e2">STEP 3</text>
  <text x="401" y="182" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#222">main 병합</text>
  <text x="401" y="204" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#666">충돌 점검·해결</text>

  <text x="472" y="184" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4a90e2">→</text>

  <rect x="484" y="128" width="98" height="104" rx="10" fill="#4a90e2"/>
  <text x="533" y="156" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#d9ecff">STEP 4</text>
  <text x="533" y="182" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#fff">배포 완료</text>
  <text x="533" y="204" text-anchor="middle" font-family="Pretendard, -apple-system, sans-serif" font-size="10" fill="#eaf3ff">GitHub Pages</text>

  <!-- Bottom QA Box -->
  <rect x="58" y="256" width="524" height="82" rx="10" fill="#f9fafc" stroke="#e4eaf2"/>
  <text x="80" y="284" font-family="Pretendard, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#333">최종 통합 점검 항목</text>
  <text x="80" y="308" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#555">• 5개 페이지 상단 네비게이션 연결 확인    • PC / 모바일 반응형 레이아웃 깨짐 점검</text>
  <text x="80" y="326" font-family="Pretendard, -apple-system, sans-serif" font-size="11" fill="#555">• README 배포 주소 업데이트              • 병합 충돌 발생 시 해결 과정 문서화</text>
</svg>
